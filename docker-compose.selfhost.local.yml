# Local self-host override. Dokploy/Traefik deployments should use only
# docker-compose.selfhost.yml and must not publish shared host ports.

services:
  backend:
    ports:
      - "127.0.0.1:${BACKEND_PORT:-${API_PORT:-${SERVER_PORT:-${PORT:-8080}}}}:8080"

  frontend:
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
